<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>تطبيق الإدارة المالية للمزرعة</title>
    <meta name="description" content="تطبيق متكامل للإدارة المالية للمزارع: إدارة الموظفين والإعدادات، اليومية العامة للمصاريف، دفاتر الأستاذ، واستخراج تقارير تسوية العهدة الشهرية مع دعم استيراد وتصدير أكسيل والمشاركة والطباعة." />
    
    <!-- App Icons (100% local for guaranteed offline support) -->
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    
    <!-- OpenGraph & Social Cards -->
    <meta property="og:title" content="Farm_Financial" />
    <meta property="og:description" content="النظام المالي لإدارة المزرعة" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/icon-512.png" />
    <meta name="msapplication-TileImage" content="/icon-512.png" />
    <meta name="msapplication-TileColor" content="#064e3b" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <meta name="theme-color" content="#064e3b" />
    <meta name="background-color" content="#064e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="المزرعة" />
  </head>
  <body class="bg-slate-50 text-slate-900 select-none overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('Service Worker active with scope:', reg.scope);
              reg.update();
              
              // Request persistent storage so the browser never deletes cached app files
              if (navigator.storage && navigator.storage.persist) {
                navigator.storage.persist().then(persistent => {
                  console.log('App storage persistence:', persistent ? 'Granted' : 'Default');
                });
              }
            })
            .catch(err => {
              console.log('SW registration error:', err);
            });
        });
      }
    </script>
  </body>
</html>
